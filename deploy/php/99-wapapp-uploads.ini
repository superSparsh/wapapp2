; Shared PHP upload limits for WhatsApp media (image 5MB, other types 14MB).
;
; Apache2 (mod_php) — typical:
;   sudo cp deploy/php/99-wapapp-uploads.ini /etc/php/$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')/apache2/conf.d/
;   sudo systemctl reload apache2
;
; PHP-FPM (nginx etc.):
;   sudo cp deploy/php/99-wapapp-uploads.ini /etc/php/8.3/fpm/conf.d/
;   sudo systemctl reload php8.3-fpm
upload_max_filesize = 16M
post_max_size = 20M
max_file_uploads = 20
