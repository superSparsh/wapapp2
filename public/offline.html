<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16a34a">
  <title>Offline — WapApp</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      background: #f6f7fb;
      color: #1a1a1a;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 420px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 4px 6px rgba(0,0,0,.04);
    }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { margin: 0; line-height: 1.5; color: #667085; font-size: .95rem; }
    button {
      margin-top: 20px;
      border: 0;
      border-radius: 10px;
      background: #16a34a;
      color: #fff;
      font-weight: 600;
      padding: 12px 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You’re offline</h1>
    <p>WapApp needs a connection for inbox, campaigns, and messaging. Reconnect, then try again.</p>
    <button type="button" onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
